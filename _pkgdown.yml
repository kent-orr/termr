  structure:
    left: [home, getting-started, articles, reference, news, guides]
    right: [github]
  components:
    getting-started:
      text: Get started
      href: articles/getting-started.html
    guides:
      text: Guides
      menu:
      - text: Widgets, layout, events, and styling
        href: https://github.com/menshikovs/termr/tree/main/docs
      - text: Data tools
        href: https://github.com/menshikovs/termr/blob/main/docs/data.md
      - text: SQL workflows
        href: https://github.com/menshikovs/termr/blob/main/docs/sql.md
      - text: Headless testing
        href: articles/testing-terminal-ui.html
      - text: API stability
        href: https://github.com/menshikovs/termr/blob/main/docs/stability.md
      - text: Agent recipes
        href: https://github.com/menshikovs/termr/tree/main/docs/agent-recipes
      - text: Search Console setup
        href: https://github.com/menshikovs/termr/blob/main/docs/search-console.md
